<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dw layer export</title>
<!-- Served on 127.0.0.1 by tools/dw_export.mjs. The mockups' fonts come from the same OFL TTFs the firmware fonts are
     cut from (tools/fonts.sh), so the export works offline; dw_export.mjs also blocks Google Fonts. -->
<style>
@font-face { font-family: "Cormorant SC"; font-weight: 500; src: url("/tools/fonts/CormorantSC-Medium.ttf"); }
@font-face { font-family: "Cormorant SC"; font-weight: 700; src: url("/tools/fonts/CormorantSC-Bold.ttf"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("/tools/fonts/IBMPlexSans-Regular.ttf"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 500; src: url("/tools/fonts/IBMPlexSans-Medium.ttf"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("/tools/fonts/IBMPlexSans-SemiBold.ttf"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("/tools/fonts/IBMPlexMono-Regular.ttf"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("/tools/fonts/IBMPlexMono-Medium.ttf"); }
body { background: #000; }
</style>
</head>
<body>
<script>window.OMNI_FACES = [];</script>
<!-- dw_export.js first: it seeds Math.random, tags canvases and guards drawn text before any mockup code exists.
     tools/dw_export.mjs then adds the mockups (read in place) with page.addScriptTag. -->
<script src="/tools/export/dw_export.js"></script>
<script src="/tools/export/dw_generic.js"></script>
</body>
</html>
